name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      EXTERNAL_NETWORK_ENABLED: "false"
      ENABLE_OPENALEX: "false"
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      XFYUN_SPARK_APP_ID: ""
      XFYUN_SPARK_API_KEY: ""
      XFYUN_SPARK_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,rag,xfyun]"
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm test --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
