name: live-provider-smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    environment: live-smoke
    env:
      APP_ENV: production
      EXTERNAL_NETWORK_ENABLED: "true"
      ENABLE_OPENALEX: "true"
      XFYUN_SPARK_APP_ID: ${{ secrets.XFYUN_SPARK_APP_ID }}
      XFYUN_SPARK_API_KEY: ${{ secrets.XFYUN_SPARK_API_KEY }}
      XFYUN_SPARK_API_SECRET: ${{ secrets.XFYUN_SPARK_API_SECRET }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      RUN_LIVE_SMOKE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,rag,xfyun]"
      - run: pytest -q -m live
