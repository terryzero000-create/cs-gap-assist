[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-gap-assist-backend"
version = "0.1.0"
description = "CS research gap analysis assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
rag = ["chromadb>=0.5.0", "PyMuPDF>=1.24.0"]
xfyun = ["numpy>=1.26.0"]
pdf-advanced = [
  "Pillow>=10.0.0",
  "pytesseract>=0.3.13",
  "pymupdf-layout>=1.26.0"
]
rerank = ["sentence-transformers>=3.0.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = [
  "live: manually triggered tests that call configured external providers"
]
